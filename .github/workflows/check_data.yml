name: Check Seed Data Compatibility
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/wheel@v4
        with:
          python-version: '3.10'

      - name: Run TradingView Seed Validator
        run: |
          echo "Starting TradingView CI Schema Check..."
          # 这里可以运行你本地编写的合规性脚本验证 CSV 格式是否包含非数字或时间格式异常
          python -c "
          import pandas as pd
          df = pd.read_csv('data/US_PUBLIC_DEBT.csv', header=None)
          assert df.shape[1] == 6, 'CSV 必须严格保证 6 列'
          assert df[0].astype(str).str.endswith('T').all(), '时间必须以大写 T 结尾'
          print('CI 格式自检完美通过！')
          "
